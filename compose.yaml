services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: memly
      POSTGRES_USER: memly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-memly}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U memly -d memly']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
