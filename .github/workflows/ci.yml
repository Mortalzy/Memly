name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: memly_test
          POSTGRES_USER: memly
          POSTGRES_PASSWORD: memly_test_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U memly -d memly_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://memly:memly_test_password@localhost:5432/memly_test
      TEST_DATABASE_URL: postgresql://memly:memly_test_password@localhost:5432/memly_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
