# Replace every memly.example with your domain before installing.
server {
  listen 80;
  listen [::]:80;
  server_name memly.example;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    try_files $uri =404;
  }
  location / {
    return 301 https://memly.example$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name memly.example;
  ssl_certificate /etc/letsencrypt/live/memly.example/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/memly.example/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  server_tokens off;
  client_max_body_size 4m;
  client_body_timeout 15s;

  # Use the fixed canonical host and overwrite headers from the internet.
  location / {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host memly.example;
    proxy_set_header X-Forwarded-Host memly.example;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    # Auth callback query strings contain tokens; do not log them.
    access_log off;
  }
}
